
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#263b59">
<title>My Knowledge</title>
<link rel="manifest" href="manifest.json">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#253247;
font-family:system-ui,sans-serif}
header{background:#263b59;color:white;padding:22px 18px}
header h1{margin:0;font-size:23px}
header p{margin:5px 0 0;font-size:13px;opacity:.8}
main{max-width:650px;margin:auto;padding:16px}
input,textarea{width:100%;padding:13px;border:1px solid #d5dce5;
border-radius:10px;font-size:16px;background:white;margin-bottom:10px}
textarea{min-height:150px;resize:vertical}
button{border:0;border-radius:9px;padding:12px 16px;
font-size:15px;font-weight:600;cursor:pointer}
.primary{background:#263b59;color:white;width:100%}
.secondary{background:#e2e8f0;color:#263b59}
.danger{background:#fee2e2;color:#b91c1c}
.card{background:white;border:1px solid #e0e5ec;
border-radius:12px;padding:15px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:17px}
.card p{white-space:pre-wrap;overflow-wrap:anywhere;
line-height:1.6;margin:0 0 12px;color:#526174}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.small{font-size:12px;color:#718096}
#formArea{display:none}
#empty{text-align:center;padding:35px;color:#718096}
 .section-list{
 margin:10px 0;
 padding-left:20px;
 color:#526174;
 font-size:14px;
 line-height:1.8;
}
.section-item{
 background:#f7f9fc;
 border:1px solid #e0e5ec;
 border-radius:9px;
 margin:8px 0;
 overflow:hidden;
}
.section-item summary{
 padding:12px;
 font-weight:600;
 cursor:pointer;
 color:#263b59;
}
.section-content{
 padding:12px;
 border-top:1px solid #e0e5ec;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 line-height:1.7;
 color:#526174;
}
.detail-controls{
 display:flex;
 gap:8px;
 margin:10px 0;
}
.detail-controls button{
 flex:1;
 font-size:13px;
 padding:9px 5px;
}
</style>
</head>
<body>
<header>
<h1>📚 My Knowledge</h1>
<p>自分専用の知識データベース</p>
</header>
<main>

<input id="search" placeholder="知識を検索..." oninput="render()">
<button class="primary" style="margin-top:10px;background:#7252a3"
 onclick="summarizeKeyword()">
 ✨ 検索単語の概要をまとめる
</button>
 
<button class="primary" onclick="newEntry()">＋ 新しい知識を登録</button>

<button class="primary" style="margin-top:10px;background:#28745a"
 onclick="showImport()">AI情報を取り込む</button>

<section id="importArea" class="card" style="display:none">
<h3>AI情報取り込み</h3>
<p class="small">ChatGPTで整理した情報を貼り付けてください。</p>
<textarea id="importText"
 placeholder="ChatGPTの調査結果をここに貼り付け"></textarea>
<button class="primary" onclick="previewImport()">情報を振り分ける</button>

<div id="importPreview" style="display:none;margin-top:15px">
<h3>取り込み内容の確認</h3>
<label>タイトル</label>
<input id="importTitle">
<label>本文</label>
<textarea id="importBody"></textarea>
<label>参考URL</label>
<div id="importUrls" class="small"></div>
<button class="primary" style="background:#28745a"
 onclick="saveImported()">この内容を保存する</button>
<button class="secondary" style="width:100%;margin-top:8px"
 onclick="hideImport()">キャンセル</button>
</div>
</section>


<section id="formArea" class="card">
<h3 id="formTitle">新しい知識</h3>
<input id="title" placeholder="タイトル">
<textarea id="body" placeholder="知識・メモを入力してください"></textarea>
<div class="actions">
<button class="primary" onclick="saveEntry()">保存する</button>
<button class="secondary" onclick="cancelEdit()">キャンセル</button>
</div>
</section>

<p class="small" id="count">登録 0件</p>
<section id="list"></section>
</main>

<script>
let db;
let editingId=null;
let importedReferences=[];
let editingReferences=[];

const request=indexedDB.open("MyKnowledgeDB",1);

request.onupgradeneeded=e=>{
 const database=e.target.result;
 if(!database.objectStoreNames.contains("entries")){
  database.createObjectStore("entries",{keyPath:"id",autoIncrement:true});
 }
};

request.onsuccess=e=>{
 db=e.target.result;
 render();
};

request.onerror=()=>alert("データベースを開けませんでした");


function showImport(){
 document.getElementById("importArea").style.display="block";
 document.getElementById("importPreview").style.display="none";
 window.scrollTo(0,0);
}

function hideImport(){
 document.getElementById("importArea").style.display="none";
}

function previewImport(){
 const raw=document.getElementById("importText").value.trim();

 const titleMatch=raw.match(/【タイトル】\s*([\s\S]*?)(?=\n【本文】)/);
 const bodyMatch=raw.match(/【本文】\s*([\s\S]*?)(?=\n【参考URL】|$)/);
 const urlMatch=raw.match(/【参考URL】\s*([\s\S]*)$/);

 if(!titleMatch || !bodyMatch){
  alert("指定形式の情報が見つかりません。");
  return;
 }

 const title=titleMatch[1].trim();
 const body=bodyMatch[1].trim();

 importedReferences=urlMatch
  ? [...new Set(urlMatch[1].match(/https?:\/\/[^\s<>]+/g)||[])]
  : [];

 if(!title || !body){
  alert("タイトルと本文を確認してください。");
  return;
 }

 document.getElementById("importTitle").value=title;
 document.getElementById("importBody").value=body;

 const urls=document.getElementById("importUrls");
 urls.replaceChildren();

 if(importedReferences.length===0){
  urls.textContent="参考URLなし";
 }else{
  importedReferences.forEach(url=>{
   const a=document.createElement("a");
   a.href=url;
   a.textContent=url;
   a.target="_blank";
   a.rel="noopener noreferrer";
   const p=document.createElement("p");
   p.append(a);
   urls.append(p);
  });
 }

 document.getElementById("importPreview").style.display="block";
}

function saveImported(){
 const title=document.getElementById("importTitle").value.trim();
 const body=document.getElementById("importBody").value.trim();

 if(!title || !body){
  alert("タイトルと本文を入力してください。");
  return;
 }

 const store=db.transaction("entries","readwrite")
  .objectStore("entries");

 store.add({
  title,
  body,
  references:importedReferences,
  created:new Date().toISOString(),
  updated:new Date().toISOString()
 });

 store.transaction.oncomplete=()=>{
  document.getElementById("importText").value="";
  document.getElementById("importPreview").style.display="none";
  hideImport();
  render();
  alert("知識を保存しました。");
 };
}

 





function summarizeKeyword(){
 const keyword=document.getElementById("search").value.trim();

 if(!keyword){
  alert("先に検索欄へ単語を入力してください。");
  return;
 }

 const prompt=`以下のテーマについて、複数の信頼できる情報源を調査し、正確にまとめてください。

【調査テーマ】
${keyword}

【調査条件】
・公式資料、公的機関、メーカー資料を優先する
・複数の情報源を比較する
・技術的な仕組みや用途を具体的に解説する
・実務で役立つ情報を含める
・不確かな情報は断定せず、その旨を明記する
・参考URLを必ず記載する

【最重要：出力形式】
以下の3つの見出しを必ず使用してください。
見出しの省略・変更は禁止です。
前置きや後書きは一切付けないでください。
回答全体をそのまま情報取り込み機能に貼り付けられる形式にしてください。

【タイトル】
調査テーマを簡潔に表したタイトル

【本文】
概要、仕組み、構成、用途、技術的な特徴、実務上の注意点などを体系的に記載してください。
必要に応じて箇条書きや小見出しを使用してください。

【参考URL】
実際に参照した情報源のURLを1行に1つずつ記載してください。
参考URLがない場合は「該当なし」と記載してください。

【厳守事項】
・必ず【タイトル】から始める
・【タイトル】【本文】【参考URL】の表記を一字一句変更しない
・Markdownのコードブロックで囲まない`;

 const area=document.createElement("textarea");
 area.value=prompt;
 area.style.position="fixed";
 area.style.left="10px";
 area.style.top="10px";
 area.style.width="90%";
 area.style.height="65%";
 area.style.zIndex="9999";
 area.style.background="white";
 area.style.color="black";
 area.style.padding="15px";
 area.style.fontSize="16px"; 

 const copy=document.createElement("button");
copy.textContent="📋 調査依頼文をコピー";
copy.style.position="fixed";
copy.style.top="68%";
copy.style.left="10px";
copy.style.width="90%";
copy.style.background="#28745a";
copy.style.color="white";
copy.style.zIndex="10000";

const message=document.createElement("p");
message.style.position="fixed";
message.style.top="76%";
message.style.left="10px";
message.style.zIndex="10000";
message.style.background="white";
message.style.padding="10px";

 const close=document.createElement("button");
 close.textContent="閉じる";
 close.style.position="fixed";
 close.style.top="86%";
 close.style.left="10px";
 close.style.width="90%";
 close.style.zIndex="10000";

 copy.onclick=async()=>{
  try{
   await navigator.clipboard.writeText(prompt);
   message.textContent="コピーしました！ChatGPTに貼り付けてください。";
  }catch(e){
   area.focus();
   area.select();
   area.setSelectionRange(0,area.value.length);
   const result=document.execCommand("copy");
   message.textContent=result
    ?"コピーしました！"
    :"自動コピーできません。文章を長押ししてコピーしてください。";
  }
 };

 close.onclick=()=>{
  area.remove();
  copy.remove();
  message.remove();
  close.remove();
 };

 document.body.append(area,copy,message,close);
}


function newEntry(){
 editingReferences=[];
 editingId=null;
 document.getElementById("formTitle").textContent="新しい知識";
 document.getElementById("title").value="";
 document.getElementById("body").value="";
 document.getElementById("formArea").style.display="block";
 window.scrollTo(0,0);
}


function cancelEdit(){
 document.getElementById("formArea").style.display="none";
 editingId=null;
}

function saveEntry(){
 const title=document.getElementById("title").value.trim();
 const body=document.getElementById("body").value.trim();
 if(!title){alert("タイトルを入力してください");return}
 if(!body){alert("本文を入力してください");return}

 const store=db.transaction("entries","readwrite").objectStore("entries");
 const entry={
 title,body,
 references:editingReferences,
 updated:new Date().toISOString()
};

 if(editingId!==null){
  entry.id=editingId;
  store.put(entry);
 }else{
  entry.created=new Date().toISOString();
  store.add(entry);
 }

 store.transaction.oncomplete=()=>{
  cancelEdit();
  render();
 };
}

function render(){
 if(!db)return;

 const keyword=document.getElementById("search").value.toLowerCase();
 const store=db.transaction("entries","readonly").objectStore("entries");
 const req=store.getAll();

 req.onsuccess=()=>{
  const entries=req.result.sort((a,b)=>b.id-a.id);

  const filtered=entries.filter(e=>
   e.title.toLowerCase().includes(keyword)||
   e.body.toLowerCase().includes(keyword)
  );

  document.getElementById("count").textContent=
   `登録 ${entries.length}件 / 検索結果 ${filtered.length}件`;

  const list=document.getElementById("list");
  list.innerHTML="";

  if(filtered.length===0){
   list.innerHTML='<div id="empty">該当する知識はありません</div>';
   return;
  }

  filtered.forEach(e=>{
   const card=document.createElement("article");
   card.className="card";

   const heading=document.createElement("h3");
   heading.textContent=e.title;

   // 本文を見出しごとに分割
   const lines=e.body.split(/\r?\n/);
   const sections=[];
   let current=null;

   const isHeading=line=>{
    const s=line.trim();

    if(!s)return false;
    if(/^[-*・●]/.test(s))return false;

    return (
     /^#{1,6}\s+/.test(s) ||
     /^【.+】$/.test(s) ||
     /^(第?\d+[章節.．、]\s*).{1,30}$/.test(s) ||
     (s.length<=28 && !/[。！？：:、]$/.test(s))
    );
   };

   lines.forEach(line=>{
    if(isHeading(line)){
     current={
      title:line.trim().replace(/^#{1,6}\s+/,""),
      body:""
     };
     sections.push(current);
    }else if(current){
     current.body+=line+"\n";
    }else{
     if(!sections.length){
      current={title:"概要",body:""};
      sections.push(current);
     }
     current.body+=line+"\n";
    }
   });

   if(sections.length===0){
    sections.push({title:"本文",body:e.body});
   }

   // タイトルと見出しだけ表示
   const sectionList=document.createElement("ul");
   sectionList.className="section-list";

   sections.forEach(s=>{
    const li=document.createElement("li");
    li.textContent=s.title;
    sectionList.append(li);
   });

   card.append(heading,sectionList);

   // 一括開閉ボタン
   const controls=document.createElement("div");
   controls.className="detail-controls";

   const openAll=document.createElement("button");
   openAll.className="secondary";
   openAll.textContent="すべて開く";

   const closeAll=document.createElement("button");
   closeAll.className="secondary";
   closeAll.textContent="すべて閉じる";

   controls.append(openAll,closeAll);
   card.append(controls);

   // 各項目の表示・非表示
   const sectionDetails=[];

   sections.forEach(s=>{
    const detail=document.createElement("details");
    detail.className="section-item";

    const summary=document.createElement("summary");
    summary.textContent=s.title;

    const content=document.createElement("div");
    content.className="section-content";
    content.textContent=s.body.trim()||"本文なし";

    detail.append(summary,content);
    card.append(detail);
    sectionDetails.push(detail);
   });

   openAll.onclick=()=>{
    sectionDetails.forEach(d=>d.open=true);
   };

   closeAll.onclick=()=>{
    sectionDetails.forEach(d=>d.open=false);
   };

   // 参考URL
   if(e.references && e.references.length){
    const refDetail=document.createElement("details");
    refDetail.className="section-item";

    const refSummary=document.createElement("summary");
    refSummary.textContent=`参考URL（${e.references.length}件）`;

    const refContent=document.createElement("div");
    refContent.className="section-content";

    e.references.forEach(url=>{
     const a=document.createElement("a");
     a.href=url;
     a.textContent=url;
     a.target="_blank";
     a.rel="noopener noreferrer";
     const p=document.createElement("p");
     p.append(a);
     refContent.append(p);
    });

    refDetail.append(refSummary,refContent);
    card.append(refDetail);
   }

   // 編集・削除
   const actions=document.createElement("div");
   actions.className="actions";

   const edit=document.createElement("button");
   edit.className="secondary";
   edit.textContent="編集";
   edit.onclick=()=>editEntry(e);

   const del=document.createElement("button");
   del.className="danger";
   del.textContent="削除";
   del.onclick=()=>deleteEntry(e.id);

   actions.append(edit,del);
   card.append(actions);

   list.append(card);
  });
 };
}


function editEntry(e){
 editingReferences=e.references||[];
 editingId=e.id;
 document.getElementById("formTitle").textContent="知識を編集";
 document.getElementById("title").value=e.title;
 document.getElementById("body").value=e.body;
 document.getElementById("formArea").style.display="block";
 window.scrollTo(0,0);
}

function deleteEntry(id){
 if(!confirm("この知識を削除しますか？"))return;
 const store=db.transaction("entries","readwrite").objectStore("entries");
 store.delete(id);
 store.transaction.oncomplete=render;
}
</script>
</body>
</html>
