
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#263b59">
<title>My Knowledge</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#253247;
font-family:system-ui,sans-serif}
header{background:#263b59;color:white;padding:22px 18px}
header h1{margin:0;font-size:23px}
header p{margin:5px 0 0;font-size:13px;opacity:.8}
main{max-width:650px;margin:auto;padding:16px}
input,textarea{width:100%;padding:13px;border:1px solid #d5dce5;
border-radius:10px;font-size:16px;background:white;margin-bottom:10px}
textarea{min-height:150px;resize:vertical}
button{border:0;border-radius:9px;padding:12px 16px;
font-size:15px;font-weight:600;cursor:pointer}
.primary{background:#263b59;color:white;width:100%}
.secondary{background:#e2e8f0;color:#263b59}
.danger{background:#fee2e2;color:#b91c1c}
.card{background:white;border:1px solid #e0e5ec;
border-radius:12px;padding:15px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:17px}
.card p{white-space:pre-wrap;overflow-wrap:anywhere;
line-height:1.6;margin:0 0 12px;color:#526174}
.actions{display:flex;gap:8px}
.actions button{flex:1}
.small{font-size:12px;color:#718096}
#formArea{display:none}
#empty{text-align:center;padding:35px;color:#718096}
</style>
</head>
<body>
<header>
<h1>📚 My Knowledge</h1>
<p>自分専用の知識データベース</p>
</header>
<main>

<input id="search" placeholder="知識を検索..." oninput="render()">
<button class="primary" style="margin-top:10px;background:#7252a3"
 onclick="summarizeKeyword()">
 ✨ 検索単語の概要をまとめる
</button>
 
<button class="primary" onclick="newEntry()">＋ 新しい知識を登録</button>

<button class="primary" style="margin-top:10px;background:#28745a"
 onclick="showImport()">AI情報を取り込む</button>

<section id="importArea" class="card" style="display:none">
<h3>AI情報取り込み</h3>
<p class="small">ChatGPTで整理した情報を貼り付けてください。</p>
<textarea id="importText"
 placeholder="ChatGPTの調査結果をここに貼り付け"></textarea>
<button class="primary" onclick="previewImport()">情報を振り分ける</button>

<div id="importPreview" style="display:none;margin-top:15px">
<h3>取り込み内容の確認</h3>
<label>タイトル</label>
<input id="importTitle">
<label>本文</label>
<textarea id="importBody"></textarea>
<label>参考URL</label>
<div id="importUrls" class="small"></div>
<button class="primary" style="background:#28745a"
 onclick="saveImported()">この内容を保存する</button>
<button class="secondary" style="width:100%;margin-top:8px"
 onclick="hideImport()">キャンセル</button>
</div>
</section>


<section id="formArea" class="card">
<h3 id="formTitle">新しい知識</h3>
<input id="title" placeholder="タイトル">
<textarea id="body" placeholder="知識・メモを入力してください"></textarea>
<div class="actions">
<button class="primary" onclick="saveEntry()">保存する</button>
<button class="secondary" onclick="cancelEdit()">キャンセル</button>
</div>
</section>

<p class="small" id="count">登録 0件</p>
<section id="list"></section>
</main>

<script>
let db;
let editingId=null;
let importedReferences=[];
let editingReferences=[];

const request=indexedDB.open("MyKnowledgeDB",1);

request.onupgradeneeded=e=>{
 const database=e.target.result;
 if(!database.objectStoreNames.contains("entries")){
  database.createObjectStore("entries",{keyPath:"id",autoIncrement:true});
 }
};

request.onsuccess=e=>{
 db=e.target.result;
 render();
};

request.onerror=()=>alert("データベースを開けませんでした");


function showImport(){
 document.getElementById("importArea").style.display="block";
 document.getElementById("importPreview").style.display="none";
 window.scrollTo(0,0);
}

function hideImport(){
 document.getElementById("importArea").style.display="none";
}

function previewImport(){
 const raw=document.getElementById("importText").value.trim();

 const titleMatch=raw.match(/【タイトル】\s*([\s\S]*?)(?=\n【本文】)/);
 const bodyMatch=raw.match(/【本文】\s*([\s\S]*?)(?=\n【参考URL】|$)/);
 const urlMatch=raw.match(/【参考URL】\s*([\s\S]*)$/);

 if(!titleMatch || !bodyMatch){
  alert("指定形式の情報が見つかりません。");
  return;
 }

 const title=titleMatch[1].trim();
 const body=bodyMatch[1].trim();

 importedReferences=urlMatch
  ? [...new Set(urlMatch[1].match(/https?:\/\/[^\s<>]+/g)||[])]
  : [];

 if(!title || !body){
  alert("タイトルと本文を確認してください。");
  return;
 }

 document.getElementById("importTitle").value=title;
 document.getElementById("importBody").value=body;

 const urls=document.getElementById("importUrls");
 urls.replaceChildren();

 if(importedReferences.length===0){
  urls.textContent="参考URLなし";
 }else{
  importedReferences.forEach(url=>{
   const a=document.createElement("a");
   a.href=url;
   a.textContent=url;
   a.target="_blank";
   a.rel="noopener noreferrer";
   const p=document.createElement("p");
   p.append(a);
   urls.append(p);
  });
 }

 document.getElementById("importPreview").style.display="block";
}

function saveImported(){
 const title=document.getElementById("importTitle").value.trim();
 const body=document.getElementById("importBody").value.trim();

 if(!title || !body){
  alert("タイトルと本文を入力してください。");
  return;
 }

 const store=db.transaction("entries","readwrite")
  .objectStore("entries");

 store.add({
  title,
  body,
  references:importedReferences,
  created:new Date().toISOString(),
  updated:new Date().toISOString()
 });

 store.transaction.oncomplete=()=>{
  document.getElementById("importText").value="";
  document.getElementById("importPreview").style.display="none";
  hideImport();
  render();
  alert("知識を保存しました。");
 };
}

 


function summarizeKeyword(){
 const keyword=document.getElementById("search").value.trim();

 if(!keyword){
  alert("先に検索欄へ単語を入力してください。");
  return;
 }

 const prompt=`以下のテーマについて、複数の信頼できる情報源を調査し、正確にまとめてください。

【調査テーマ】
${keyword}

【調査条件】
・公式資料、公的機関、メーカー資料を優先する
・複数の情報源を比較する
・技術的な仕組みや用途を具体的に解説する
・実務で役立つ情報を含める
・情報が不確かな場合は断定しない
・参考URLを必ず記載する

【出力形式】

【タイトル】
${keyword}

【本文】
概要：
基本知識：
詳細解説：
重要ポイント：
注意事項：

【参考URL】
URLを1行に1つずつ記載`;

 // ChatGPTを先に開く
 window.open("https://chatgpt.com/","_blank");

 // 調査依頼文をコピー
 if(navigator.clipboard && navigator.clipboard.writeText){
  navigator.clipboard.writeText(prompt)
   .then(()=>{
    alert("調査依頼文をコピーしました。ChatGPTに貼り付けてください。");
   })
   .catch(()=>{
    window.prompt("以下の文章をコピーしてください。",prompt);
   });
 }else{
  window.prompt("以下の文章をコピーしてください。",prompt);
 }
}


function newEntry(){
 editingReferences=[];
 editingId=null;
 document.getElementById("formTitle").textContent="新しい知識";
 document.getElementById("title").value="";
 document.getElementById("body").value="";
 document.getElementById("formArea").style.display="block";
 window.scrollTo(0,0);
}


function cancelEdit(){
 document.getElementById("formArea").style.display="none";
 editingId=null;
}

function saveEntry(){
 const title=document.getElementById("title").value.trim();
 const body=document.getElementById("body").value.trim();
 if(!title){alert("タイトルを入力してください");return}
 if(!body){alert("本文を入力してください");return}

 const store=db.transaction("entries","readwrite").objectStore("entries");
 const entry={
 title,body,
 references:editingReferences,
 updated:new Date().toISOString()
};

 if(editingId!==null){
  entry.id=editingId;
  store.put(entry);
 }else{
  entry.created=new Date().toISOString();
  store.add(entry);
 }

 store.transaction.oncomplete=()=>{
  cancelEdit();
  render();
 };
}

function render(){
 if(!db)return;
 const keyword=document.getElementById("search").value.toLowerCase();
 const store=db.transaction("entries","readonly").objectStore("entries");
 const req=store.getAll();

 req.onsuccess=()=>{
  const entries=req.result.sort((a,b)=>b.id-a.id);
  const filtered=entries.filter(e=>
   e.title.toLowerCase().includes(keyword)||
   e.body.toLowerCase().includes(keyword)
  );

  document.getElementById("count").textContent=
   `登録 ${entries.length}件 / 検索結果 ${filtered.length}件`;

  const list=document.getElementById("list");
  list.innerHTML="";

  if(filtered.length===0){
   list.innerHTML='<div id="empty">該当する知識はありません</div>';
   return;
  }

  filtered.forEach(e=>{
   const card=document.createElement("article");
   card.className="card";

   const heading=document.createElement("h3");
   heading.textContent=e.title;

   const paragraph=document.createElement("p");
   paragraph.textContent=e.body;

   const actions=document.createElement("div");
   actions.className="actions";

   const edit=document.createElement("button");
   edit.className="secondary";
   edit.textContent="編集";
   edit.onclick=()=>editEntry(e);

   const del=document.createElement("button");
   del.className="danger";
   del.textContent="削除";
   del.onclick=()=>deleteEntry(e.id);

   actions.append(edit,del);
   
const refs=document.createElement("div");
refs.className="small";

(e.references||[]).forEach(url=>{
 const a=document.createElement("a");
 a.href=url;
 a.textContent="参考資料を開く ↗";
 a.target="_blank";
 a.rel="noopener noreferrer";
 const p=document.createElement("p");
 p.append(a);
 refs.append(p);
});

card.append(heading,paragraph,refs,actions);

   list.append(card);
  });
 };
}

function editEntry(e){
 editingReferences=e.references||[];
 editingId=e.id;
 document.getElementById("formTitle").textContent="知識を編集";
 document.getElementById("title").value=e.title;
 document.getElementById("body").value=e.body;
 document.getElementById("formArea").style.display="block";
 window.scrollTo(0,0);
}

function deleteEntry(id){
 if(!confirm("この知識を削除しますか？"))return;
 const store=db.transaction("entries","readwrite").objectStore("entries");
 store.delete(id);
 store.transaction.oncomplete=render;
}
</script>
</body>
</html>
